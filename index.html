<!DOCTYPE html>
<html>

<head>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js">
  </script>

</head>

<body>
  <a-scene>
    <a-assets>
      <a-asset-item id="barrel" src="assets/GLB format/barrel.glb"></a-asset-item>
      <a-asset-item id="bottle" src="assets/GLB format/bottle.glb"></a-asset-item>
    </a-assets>

    <a-sky color="lightblue"></a-sky>

    <a-entity camera look-controls>
      <a-entity cursor="rayOrigin: mouse;" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.02;
radiusOuter: 0.03" material="color: black; shader: flat">
        <a-asset><audio id="biem" src="biem.mp3" preload="auto"></audio></a-asset>

      </a-entity>
    </a-entity>
    <a-box id="mijnKubus" position="1 -3 -3" width="1000" height="1" depth="500" color="yellow"></a-box>
    <a-box id="mijnKubus" position="100 -1 -40" width="1000" height="1" depth="50" color="blue"></a-box>
    <a-sphere id="ball" position="4 0 0" color="brown"
      animation__mouseleave="property: material.color; to: brown; startEvents: onclick; dur: 200" sound="src: #biem"
      onclick=explode()>
    </a-sphere>
    <a-entity gltf-model="#barrel" position="1 0.2 -3" scale="0.5 0.5 0.5"
    animation="property: rotation;
to: 0 360 0; loop: true;
dur: 8000; easing: linear"

animation__float="property: position;
dir: alternate; to: 0 1.2 -3;
loop: true; dur: 2000;
easing: easeInOutSine">></a-entity>

    <a-entity gltf-model="#bottle" position="2 0.2 -3" scale="0.5 0.5 0.5"></a-entity>
  
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
<a-entity light="type: directional; intensity: 1" position="2 4 1"></a-entity>
<a-entity light="type: point; color: yellow; intensity: 10" position="2 4 1" ></a-entity>
<a-sphere position="2 4 1" radius="1"  material="color:yellow; shader:flat;" ></a-sphere>
<!-- schaduw: scène aan + per object cast/receive -->
<a-entity geometry="primitive: box"
material="color: #c2a878"
shadow="cast: true; receive: true"></a-entity>


  </a-scene>


    <script>


      function explode() {


        const ball = document.querySelector('#ball');
        const pos = ball.getAttribute('position');

        ball.components.sound.playSound();

        for (let i = 0; i < 999; i++) {
          const piece = document.createElement('a-sphere');

          piece.setAttribute('radius', '0.12');
          piece.setAttribute('color', 'orange');
          piece.setAttribute('position', pos);

          const x = (Math.random() - 0.5) * 8;
          const y = (Math.random() - 0.5) * 8;
          const z = (Math.random() - 0.5) * 8;

          piece.setAttribute(
            'animation__move',
            `property: position; to: ${pos.x + x} ${pos.y + y} ${pos.z + z}; dur: 700; easing: easeOutQuad`
          );

          piece.setAttribute(
            'animation__fade',
            'property: scale; to: 0 0 0; dur: 700; easing: easeInQuad'
          );

          document.querySelector('a-scene').appendChild(piece);

          setTimeout(() => piece.remove(), 750);
        }

        ball.remove();

      }

    </script>


    <a-entity id="river" geometry="primitive: plane" material="color: blue" position="0 0 0"
      sound="src: url(s.mp); autoplay: true"></a-entity>


</body>

</html>
